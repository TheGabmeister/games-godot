<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" shape-rendering="crispEdges">
  <!-- FF1 Goblin - Small green goblin with knife (facing right) -->
  <!-- Ears -->
  <rect x="22" y="4" width="6" height="4" fill="#40A040"/>
  <rect x="44" y="4" width="6" height="4" fill="#40A040"/>
  <!-- Head -->
  <rect x="26" y="6" width="20" height="16" fill="#50B050"/>
  <rect x="28" y="8" width="16" height="12" fill="#60C060"/>
  <!-- Eyes -->
  <rect x="36" y="10" width="4" height="4" fill="#C02020"/>
  <rect x="42" y="10" width="4" height="4" fill="#C02020"/>
  <!-- Mouth -->
  <rect x="38" y="16" width="8" height="4" fill="#301010"/>
  <rect x="40" y="16" width="2" height="2" fill="#F0F0F0"/>
  <rect x="44" y="16" width="2" height="2" fill="#F0F0F0"/>
  <!-- Body -->
  <rect x="24" y="22" width="22" height="20" fill="#806020"/>
  <rect x="28" y="24" width="14" height="16" fill="#907030"/>
  <!-- Arms -->
  <rect x="16" y="24" width="8" height="14" fill="#50B050"/>
  <rect x="46" y="24" width="8" height="14" fill="#50B050"/>
  <!-- Knife (right hand) -->
  <rect x="54" y="20" width="4" height="14" fill="#C0C0C0"/>
  <rect x="52" y="32" width="8" height="4" fill="#806020"/>
  <!-- Legs -->
  <rect x="26" y="42" width="8" height="12" fill="#50B050"/>
  <rect x="38" y="42" width="8" height="12" fill="#50B050"/>
  <!-- Feet -->
  <rect x="24" y="54" width="10" height="6" fill="#40A040"/>
  <rect x="38" y="54" width="10" height="6" fill="#40A040"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 80" shape-rendering="crispEdges">
  <!-- FF1 Goblin Guard - Larger armored goblin with sword (facing right) -->
  <!-- Helmet -->
  <rect x="20" y="2" width="24" height="16" fill="#808080"/>
  <rect x="22" y="4" width="20" height="12" fill="#A0A0A0"/>
  <!-- Helmet crest -->
  <rect x="30" y="0" width="4" height="4" fill="#C02020"/>
  <!-- Face -->
  <rect x="24" y="18" width="20" height="12" fill="#50B050"/>
  <!-- Eyes -->
  <rect x="32" y="20" width="4" height="4" fill="#C02020"/>
  <rect x="38" y="20" width="4" height="4" fill="#C02020"/>
  <!-- Mouth -->
  <rect x="34" y="26" width="8" height="4" fill="#301010"/>
  <rect x="36" y="26" width="2" height="2" fill="#F0F0F0"/>
  <rect x="40" y="26" width="2" height="2" fill="#F0F0F0"/>
  <!-- Armor Body -->
  <rect x="18" y="30" width="28" height="24" fill="#808080"/>
  <rect x="22" y="32" width="20" height="20" fill="#A0A0A0"/>
  <!-- Belt -->
  <rect x="18" y="50" width="28" height="4" fill="#604020"/>
  <!-- Shield Arm (left) -->
  <rect x="8" y="30" width="10" height="16" fill="#808080"/>
  <!-- Shield -->
  <rect x="2" y="28" width="10" height="20" fill="#604020"/>
  <rect x="4" y="30" width="6" height="16" fill="#806030"/>
  <!-- Sword Arm (right) -->
  <rect x="46" y="30" width="10" height="16" fill="#50B050"/>
  <!-- Sword -->
  <rect x="56" y="14" width="4" height="28" fill="#C0C0C0"/>
  <rect x="54" y="40" width="8" height="4" fill="#806020"/>
  <!-- Legs -->
  <rect x="22" y="54" width="10" height="16" fill="#808080"/>
  <rect x="34" y="54" width="10" height="16" fill="#808080"/>
  <!-- Boots -->
  <rect x="20" y="70" width="12" height="6" fill="#604020"/>
  <rect x="34" y="70" width="12" height="6" fill="#604020"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 64" shape-rendering="crispEdges">
  <!-- FF1 Wolf - Grey wolf in attack stance (facing right) -->
  <!-- Tail -->
  <rect x="2" y="16" width="8" height="4" fill="#808080"/>
  <rect x="0" y="12" width="6" height="6" fill="#909090"/>
  <!-- Body -->
  <rect x="10" y="20" width="40" height="16" fill="#808080"/>
  <rect x="14" y="22" width="32" height="12" fill="#909090"/>
  <!-- Back hump -->
  <rect x="20" y="16" width="20" height="6" fill="#707070"/>
  <!-- Head -->
  <rect x="50" y="14" width="16" height="14" fill="#909090"/>
  <rect x="52" y="16" width="12" height="10" fill="#A0A0A0"/>
  <!-- Ears -->
  <rect x="52" y="8" width="6" height="8" fill="#808080"/>
  <rect x="60" y="8" width="6" height="8" fill="#808080"/>
  <!-- Eye -->
  <rect x="60" y="18" width="4" height="4" fill="#C02020"/>
  <!-- Snout -->
  <rect x="66" y="20" width="10" height="8" fill="#A0A0A0"/>
  <!-- Nose -->
  <rect x="74" y="22" width="4" height="4" fill="#303030"/>
  <!-- Mouth / Teeth -->
  <rect x="68" y="26" width="8" height="4" fill="#301010"/>
  <rect x="70" y="26" width="2" height="2" fill="#F0F0F0"/>
  <rect x="74" y="26" width="2" height="2" fill="#F0F0F0"/>
  <!-- Front Legs -->
  <rect x="42" y="36" width="6" height="18" fill="#808080"/>
  <rect x="50" y="36" width="6" height="18" fill="#808080"/>
  <!-- Front Paws -->
  <rect x="42" y="54" width="8" height="4" fill="#707070"/>
  <rect x="50" y="54" width="8" height="4" fill="#707070"/>
  <!-- Back Legs -->
  <rect x="12" y="36" width="6" height="18" fill="#808080"/>
  <rect x="20" y="36" width="6" height="18" fill="#808080"/>
  <!-- Back Paws -->
  <rect x="10" y="54" width="8" height="4" fill="#707070"/>
  <rect x="18" y="54" width="8" height="4" fill="#707070"/>
  <!-- Belly -->
  <rect x="26" y="34" width="16" height="4" fill="#B0B0B0"/>
</svg>

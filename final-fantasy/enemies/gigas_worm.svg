<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" shape-rendering="crispEdges">
  <!-- FF1 Gigas Worm - Huge purple segmented worm (facing right) -->
  <!-- Tail segment -->
  <rect x="4" y="60" width="12" height="16" fill="#602080"/>
  <rect x="6" y="62" width="8" height="12" fill="#7030A0"/>
  <rect x="4" y="74" width="12" height="2" fill="#501870"/>
  <!-- Segment 2 -->
  <rect x="14" y="52" width="14" height="20" fill="#602080"/>
  <rect x="16" y="54" width="10" height="16" fill="#7030A0"/>
  <rect x="14" y="70" width="14" height="2" fill="#501870"/>
  <!-- Segment 3 (body curves up) -->
  <rect x="26" y="40" width="16" height="24" fill="#602080"/>
  <rect x="28" y="42" width="12" height="20" fill="#7030A0"/>
  <rect x="26" y="62" width="16" height="2" fill="#501870"/>
  <!-- Segment 4 -->
  <rect x="40" y="28" width="16" height="28" fill="#602080"/>
  <rect x="42" y="30" width="12" height="24" fill="#7030A0"/>
  <rect x="40" y="54" width="16" height="2" fill="#501870"/>
  <!-- Segment 5 -->
  <rect x="54" y="18" width="16" height="30" fill="#602080"/>
  <rect x="56" y="20" width="12" height="26" fill="#7030A0"/>
  <rect x="54" y="46" width="16" height="2" fill="#501870"/>
  <!-- Head segment -->
  <rect x="68" y="10" width="20" height="28" fill="#602080"/>
  <rect x="70" y="12" width="16" height="24" fill="#7030A0"/>
  <!-- Eyes -->
  <rect x="78" y="16" width="6" height="4" fill="#C02020"/>
  <rect x="80" y="18" width="2" height="2" fill="#FF4040"/>
  <!-- Mandibles -->
  <rect x="86" y="22" width="8" height="4" fill="#501870"/>
  <rect x="86" y="30" width="8" height="4" fill="#501870"/>
  <rect x="92" y="24" width="4" height="8" fill="#602080"/>
  <!-- Mouth -->
  <rect x="88" y="26" width="4" height="4" fill="#301030"/>
  <!-- Body segments detail lines -->
  <rect x="16" y="54" width="10" height="2" fill="#8040B0"/>
  <rect x="28" y="42" width="12" height="2" fill="#8040B0"/>
  <rect x="42" y="30" width="12" height="2" fill="#8040B0"/>
  <rect x="56" y="20" width="12" height="2" fill="#8040B0"/>
  <rect x="70" y="12" width="16" height="2" fill="#8040B0"/>
  <!-- Underbelly spots -->
  <rect x="30" y="56" width="8" height="4" fill="#8040B0"/>
  <rect x="44" y="46" width="8" height="4" fill="#8040B0"/>
  <rect x="58" y="38" width="8" height="4" fill="#8040B0"/>
</svg>

  <rect x="42" y="48" width="4" height="12" fill="#282828"/>
  <rect x="40" y="58" width="8" height="6" fill="#282828"/>
  <!-- Right legs (4) -->
  <rect x="48" y="24" width="4" height="10" fill="#282828"/>
  <rect x="50" y="18" width="6" height="8" fill="#282828"/>
  <rect x="54" y="26" width="4" height="8" fill="#282828"/>
  <rect x="58" y="20" width="6" height="8" fill="#282828"/>
  <rect x="48" y="48" width="4" height="10" fill="#282828"/>

  <rect x="34" y="32" width="20" height="16" fill="#282828"/>
  <rect x="36" y="34" width="16" height="12" fill="#383838"/>
  <!-- Head -->
  <rect x="54" y="34" width="12" height="12" fill="#303030"/>

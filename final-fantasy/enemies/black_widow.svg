<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" shape-rendering="crispEdges">
  <!-- FF1 Black Widow - Large dark spider (facing right) -->
  <!-- Abdomen -->
  <rect x="6" y="28" width="28" height="24" fill="#202020"/>
  <rect x="10" y="30" width="20" height="20" fill="#303030"/>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 96" shape-rendering="crispEdges">
  <!-- FF1 Monk - Battle Stance (facing left, fists raised) -->
  <!-- Headband -->
  <rect x="22" y="10" width="20" height="6" fill="#C03030"/>
  <rect x="24" y="8" width="16" height="4" fill="#C03030"/>
  <!-- Hair -->
  <rect x="22" y="16" width="16" height="4" fill="#402010"/>
  <!-- Face -->
  <rect x="20" y="20" width="16" height="12" fill="#F0C090"/>
  <!-- Eye -->
  <rect x="22" y="24" width="4" height="4" fill="#303030"/>
  <!-- Nose -->
  <rect x="16" y="26" width="4" height="4" fill="#E0B080"/>
  <!-- Torso (gi) -->
  <rect x="22" y="32" width="24" height="24" fill="#C08040"/>
  <rect x="26" y="34" width="16" height="20" fill="#D09050"/>
  <!-- Belt -->
  <rect x="22" y="52" width="24" height="4" fill="#202020"/>
  <!-- Front Arm (fist raised high) -->
  <rect x="10" y="24" width="8" height="16" fill="#E0A870"/>
  <!-- Front Fist -->
  <rect x="8" y="20" width="8" height="8" fill="#E0A870"/>
  <!-- Back Arm (fist at side) -->
  <rect x="44" y="34" width="8" height="16" fill="#E0A870"/>
  <!-- Back Fist -->
  <rect x="44" y="48" width="8" height="8" fill="#E0A870"/>
  <!-- Legs (wide fighting stance) -->
  <rect x="18" y="56" width="10" height="20" fill="#C08040"/>
  <rect x="36" y="56" width="10" height="20" fill="#C08040"/>
  <!-- Boots -->
  <rect x="14" y="76" width="14" height="8" fill="#604020"/>
  <rect x="36" y="76" width="12" height="8" fill="#604020"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 96" shape-rendering="crispEdges">
  <!-- FF1 White Mage - Battle Stance (facing left, staff forward) -->
  <!-- Hood -->
  <rect x="20" y="4" width="24" height="20" fill="#F0F0F0"/>
  <rect x="22" y="4" width="20" height="4" fill="#E0E0E0"/>
  <!-- Hood trim -->
  <rect x="20" y="20" width="24" height="4" fill="#C02020"/>
  <!-- Face -->
  <rect x="20" y="24" width="16" height="8" fill="#F0C090"/>
  <!-- Eye -->
  <rect x="22" y="26" width="4" height="4" fill="#303030"/>
  <!-- Nose -->
  <rect x="16" y="28" width="4" height="4" fill="#E0B080"/>
  <!-- Robe Body -->
  <rect x="18" y="30" width="28" height="30" fill="#F0F0F0"/>
  <rect x="24" y="30" width="16" height="30" fill="#E8E8E8"/>
  <!-- Robe trims -->
  <rect x="18" y="30" width="28" height="4" fill="#C02020"/>
  <rect x="18" y="56" width="28" height="4" fill="#C02020"/>
  <!-- Staff Arm (extended forward) -->
  <rect x="8" y="32" width="10" height="14" fill="#F0F0F0"/>
  <!-- Hand -->
  <rect x="8" y="46" width="8" height="6" fill="#F0C090"/>
  <!-- Staff (angled forward) -->
  <rect x="4" y="8" width="4" height="44" fill="#806020"/>
  <!-- Staff orb -->
  <rect x="0" y="2" width="12" height="10" fill="#FFD700"/>
  <rect x="4" y="0" width="4" height="4" fill="#FFD700"/>
  <!-- Back arm -->
  <rect x="42" y="34" width="8" height="14" fill="#F0F0F0"/>
  <rect x="44" y="48" width="6" height="4" fill="#F0C090"/>
  <!-- Legs -->
  <rect x="20" y="60" width="12" height="20" fill="#F0F0F0"/>
  <rect x="34" y="60" width="12" height="20" fill="#F0F0F0"/>
  <!-- Boot trims -->
  <rect x="20" y="76" width="12" height="4" fill="#C02020"/>
  <rect x="34" y="76" width="12" height="4" fill="#C02020"/>
  <!-- Boots -->
  <rect x="18" y="80" width="12" height="8" fill="#C02020"/>
  <rect x="34" y="80" width="12" height="8" fill="#C02020"/>
</svg>

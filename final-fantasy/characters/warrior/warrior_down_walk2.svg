<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 96" shape-rendering="crispEdges">
  <!-- FF1 Warrior - Down Walk Frame 2 (right foot forward) -->
  <!-- Horned Helmet -->
  <rect x="16" y="4" width="4" height="12" fill="#A0A0A0"/>
  <rect x="44" y="4" width="4" height="12" fill="#A0A0A0"/>
  <rect x="20" y="8" width="24" height="12" fill="#A0A0A0"/>
  <rect x="20" y="8" width="24" height="4" fill="#C0C0C0"/>
  <!-- Face -->
  <rect x="22" y="20" width="20" height="12" fill="#F0C090"/>
  <!-- Eyes -->
  <rect x="26" y="24" width="4" height="4" fill="#303030"/>
  <rect x="34" y="24" width="4" height="4" fill="#303030"/>
  <!-- Armor Body -->
  <rect x="16" y="32" width="32" height="24" fill="#C02020"/>
  <rect x="24" y="32" width="16" height="24" fill="#D03030"/>
  <!-- Shoulder Plates -->
  <rect x="8" y="32" width="12" height="8" fill="#A0A0A0"/>
  <rect x="44" y="32" width="12" height="8" fill="#A0A0A0"/>
  <!-- Belt -->
  <rect x="16" y="52" width="32" height="4" fill="#806020"/>
  <rect x="28" y="52" width="8" height="4" fill="#C0A030"/>
  <!-- Arms - opposite swing -->
  <rect x="10" y="42" width="8" height="16" fill="#C02020"/>
  <rect x="46" y="38" width="8" height="16" fill="#C02020"/>
  <!-- Gauntlets -->
  <rect x="10" y="54" width="8" height="8" fill="#A0A0A0"/>
  <rect x="46" y="50" width="8" height="8" fill="#A0A0A0"/>
  <!-- Sword (right hand) -->
  <rect x="48" y="44" width="4" height="20" fill="#E0E0E0"/>
  <rect x="46" y="58" width="8" height="4" fill="#806020"/>
  <!-- Legs - right forward, left back -->
  <rect x="20" y="56" width="10" height="18" fill="#C02020"/>
  <rect x="34" y="56" width="10" height="24" fill="#C02020"/>
  <!-- Greaves -->
  <rect x="20" y="66" width="10" height="8" fill="#A0A0A0"/>
  <rect x="34" y="72" width="10" height="8" fill="#A0A0A0"/>
  <!-- Boots -->
  <rect x="20" y="74" width="12" height="8" fill="#604020"/>
  <rect x="32" y="80" width="12" height="8" fill="#604020"/>
</svg>
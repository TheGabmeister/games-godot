<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 96" shape-rendering="crispEdges">
  <!-- FF1 Warrior - Up Walk Frame 1 -->
  <!-- Horned Helmet -->
  <rect x="16" y="4" width="4" height="12" fill="#A0A0A0"/>
  <rect x="44" y="4" width="4" height="12" fill="#A0A0A0"/>
  <rect x="20" y="8" width="24" height="12" fill="#A0A0A0"/>
  <rect x="20" y="8" width="24" height="4" fill="#C0C0C0"/>
  <!-- Back of helmet -->
  <rect x="22" y="16" width="20" height="8" fill="#808080"/>
  <!-- Hair -->
  <rect x="24" y="20" width="16" height="8" fill="#806040"/>
  <!-- Back of Armor -->
  <rect x="16" y="32" width="32" height="24" fill="#A01818"/>
  <rect x="24" y="32" width="16" height="24" fill="#B02020"/>
  <!-- Cape -->
  <rect x="18" y="34" width="28" height="20" fill="#2020A0"/>
  <rect x="20" y="36" width="24" height="16" fill="#3030C0"/>
  <!-- Shoulder Plates -->
  <rect x="8" y="32" width="12" height="8" fill="#A0A0A0"/>
  <rect x="44" y="32" width="12" height="8" fill="#A0A0A0"/>
  <!-- Belt -->
  <rect x="16" y="52" width="32" height="4" fill="#806020"/>
  <!-- Arms swing -->
  <rect x="6" y="38" width="8" height="16" fill="#A01818"/>
  <rect x="50" y="42" width="8" height="16" fill="#A01818"/>
  <!-- Gauntlets -->
  <rect x="6" y="50" width="8" height="8" fill="#A0A0A0"/>
  <rect x="50" y="54" width="8" height="8" fill="#A0A0A0"/>
  <!-- Sword -->
  <rect x="52" y="32" width="4" height="24" fill="#E0E0E0"/>
  <rect x="50" y="56" width="8" height="4" fill="#806020"/>
  <!-- Legs - left forward -->
  <rect x="18" y="56" width="10" height="24" fill="#A01818"/>
  <rect x="36" y="56" width="10" height="18" fill="#A01818"/>
  <!-- Greaves -->
  <rect x="18" y="72" width="10" height="8" fill="#A0A0A0"/>
  <rect x="36" y="66" width="10" height="8" fill="#A0A0A0"/>
  <!-- Boots -->
  <rect x="16" y="80" width="12" height="8" fill="#604020"/>
  <rect x="36" y="74" width="12" height="8" fill="#604020"/>

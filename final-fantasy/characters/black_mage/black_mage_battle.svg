<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 96" shape-rendering="crispEdges">
  <!-- FF1 Black Mage - Battle Stance (facing left, hand extended) -->
  <!-- Hat point -->
  <rect x="28" y="0" width="8" height="4" fill="#2020A0"/>
  <rect x="24" y="4" width="16" height="4" fill="#2020A0"/>
  <!-- Hat body -->
  <rect x="20" y="8" width="24" height="8" fill="#2020A0"/>
  <!-- Hat brim -->
  <rect x="14" y="16" width="32" height="4" fill="#2020A0"/>
  <!-- Face (shadowed) -->
  <rect x="22" y="20" width="16" height="10" fill="#301810"/>
  <!-- Eyes (glowing) -->
  <rect x="24" y="22" width="4" height="4" fill="#FFD700"/>
  <!-- Robe Body -->
  <rect x="18" y="30" width="28" height="30" fill="#2020A0"/>
  <rect x="24" y="30" width="16" height="30" fill="#3030C0"/>
  <!-- Robe collar -->
  <rect x="20" y="30" width="24" height="4" fill="#4040D0"/>
  <!-- Casting Arm (extended forward) -->
  <rect x="6" y="30" width="10" height="14" fill="#2020A0"/>
  <!-- Casting hand with energy -->
  <rect x="4" y="44" width="8" height="6" fill="#806040"/>
  <rect x="2" y="40" width="8" height="6" fill="#FF6020"/>
  <rect x="4" y="38" width="4" height="4" fill="#FFD700"/>
  <!-- Back arm -->
  <rect x="42" y="34" width="8" height="14" fill="#2020A0"/>
  <rect x="44" y="48" width="6" height="6" fill="#806040"/>
  <!-- Legs -->
  <rect x="20" y="60" width="12" height="20" fill="#2020A0"/>
  <rect x="34" y="60" width="12" height="20" fill="#2020A0"/>
  <!-- Boots -->
  <rect x="18" y="80" width="12" height="8" fill="#402010"/>
  <rect x="34" y="80" width="12" height="8" fill="#402010"/>
</svg>

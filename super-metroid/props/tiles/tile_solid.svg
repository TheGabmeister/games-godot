<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32" shape-rendering="crispEdges">
  <!-- Base fill -->
  <rect x="0" y="0" width="32" height="32" fill="#585858"/>
  <!-- Top edge highlight -->
  <rect x="0" y="0" width="32" height="2" fill="#787878"/>
  <!-- Left edge highlight -->
  <rect x="0" y="0" width="2" height="32" fill="#6C6C6C"/>
  <!-- Right edge shadow -->
  <rect x="30" y="0" width="2" height="32" fill="#404040"/>
  <!-- Bottom edge shadow -->
  <rect x="0" y="30" width="32" height="2" fill="#383838"/>
  <!-- Brick lines horizontal -->
  <rect x="2" y="10" width="28" height="1" fill="#4A4A4A"/>
  <rect x="2" y="20" width="28" height="1" fill="#4A4A4A"/>
  <!-- Brick lines vertical -->
  <rect x="16" y="2" width="1" height="8" fill="#4A4A4A"/>
  <rect x="8" y="11" width="1" height="9" fill="#4A4A4A"/>
  <rect x="24" y="11" width="1" height="9" fill="#4A4A4A"/>
  <rect x="16" y="21" width="1" height="9" fill="#4A4A4A"/>
  <!-- Surface noise details -->
  <rect x="5" y="4" width="2" height="2" fill="#505050"/>
  <rect x="20" y="6" width="3" height="1" fill="#636363"/>
  <rect x="10" y="14" width="2" height="2" fill="#505050"/>
  <rect x="27" y="15" width="2" height="1" fill="#636363"/>
  <rect x="4" y="24" width="3" height="1" fill="#636363"/>
  <rect x="20" y="25" width="2" height="2" fill="#505050"/>
</svg>
